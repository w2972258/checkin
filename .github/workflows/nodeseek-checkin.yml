name: NodeSeek Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver requests

      - name: Show browser version
        run: |
          echo "Chrome:"
          google-chrome --version || true
          echo "ChromeDriver:"
          chromedriver --version || true
          echo "Python:"
          python --version

      - name: Run NodeSeek checkin
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_SIGN_MODE: chicken
          NS_HEADLESS: true
          NS_ENABLE_SCREENSHOT: true
          NS_LOG_LEVEL: INFO

          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}

          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}

          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
        run: |
          python nodeseek.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeseek-screenshots
          path: screenshots/
          if-no-files-found: ignore
