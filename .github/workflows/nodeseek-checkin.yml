name: NodeSeek Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 安装系统依赖
      # =========================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            xvfb \
            wget \
            curl \
            unzip \
            libnss3 \
            libgbm1 \
            libgtk-3-0 \
            libasound2t64 \
            libxss1 \
            fonts-liberation

      # =========================
      # 启动虚拟显示
      # =========================
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # =========================
      # Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install selenium undetected-chromedriver requests

      # =========================
      # Run
      # =========================
      - name: Run script
        env:
          DISPLAY: :99
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_SIGN_MODE: chicken
          NS_ENABLE_SCREENSHOT: "true"
          NS_LOG_LEVEL: INFO
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          python nodeseek.py

      # =========================
      # artifacts
      # =========================
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      # =========================
      # 清理记录
      # =========================
      - name: Cleanup runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
